name: Build Extensions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Marklet version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('manifest/manifest.chrome.json'))['version'])")
          echo "MARKLET_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare Chrome build
        run: |
          cp manifest/manifest.chrome.json manifest.json
          zip -r marklet-chrome.zip . -x "manifest/*" ".git/*" ".github/*" "LICENSE"

      - name: Prepare Firefox build
        run: |
          cp manifest/manifest.firefox.json manifest.json
          zip -r marklet-firefox.zip . -x "manifest/*" "*.zip" ".git/*" ".github/*" "LICENSE"

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.MARKLET_VERSION }}"
          name: "Marklet v${{ env.MARKLET_VERSION }}"
          overwrite_files: true
          make_latest: true
          files: |
            marklet-chrome.zip
            marklet-firefox.zip
